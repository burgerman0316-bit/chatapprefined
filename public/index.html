<!DOCTYPE html>
<html>
<head>
    <title>Socket.IO Chat Application</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="login-form">
    <h2>Welcome to the Chat</h2>
    <p>Enter your username or your staff key:</p>
    <input id="name-input" autocomplete="off" placeholder="Username or Staff Key" required /><br><br>
    <button type="submit">Join Chat</button>
    <p id="status-message" style="color: green; margin-top: 10px;"></p>
</div>

<div id="chat-container">
    
    <div id="side-panel">
        <h3 id="context-display">Chatting As: Guest</h3>
        
        <h4>Current Users</h4>
        <ul id="user-list">
            </ul>

        <div id="admin-panel" style="display: none;">
            <h2>Staff Controls</h2>

            <div id="admin-context-switch">
                <button id="switch-to-public-btn" class="active">Public</button>
                <button id="switch-to-admin-btn">Admin</button>
            </div>
            
            <div id="admin-controls-area">
                <p>History Tools:</p>
                <button id="clear-public-history-btn">Clear Public</button>
                <button id="clear-admin-history-btn">Clear Admin</button>
                <p style="margin-top: 10px;">Session Tools:</p>
                <button id="admin-go-anon-btn">Go Anonymous</button>
            </div>

            <h3>User Actions</h3>
            <ul id="admin-user-list">
                </ul>
        </div>
    </div>
    
    <div id="chat-area">
        <ul id="messages"></ul>
        
        <div id="typing-indicator" style="padding: 5px 10px; font-size: 0.9em; color: #555;"></div>

        <form id="chat-form" action="">
            <input id="m" autocomplete="off" placeholder="Type your message, or use /pm <user> <msg>" autofocus />
            <button>Send</button>
        </form>
    </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="client.js"></script>

</body>
</html>
