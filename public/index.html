<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat - Dark Theme</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!-- Chat Container -->
    <div class="chat-container">
        <!-- Header -->
        <div class="header-area">
            <span id="userCountDisplay">0 Users Online</span>
            <div class="right-header">
                <input id="usernameInput" type="text" placeholder="Enter your name" />
                <button id="joinBtn">Join Chat</button>
                <button id="clearChatBtn" style="display: none;">Clear Chat</button>
            </div>
        </div>

        <!-- Messages -->
        <div class="messages-area">
            <ul id="messages"></ul>
        </div>

        <!-- Message Input -->
        <form id="messageForm">
            <div class="input-container">
                <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message..."></div>
            </div>
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- Bootstrap Name Modal -->
    <div class="modal fade" id="nameModal" tabindex="-1" aria-labelledby="nameModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="nameModalLabel">Enter Your Name</h5>
                </div>
                <div class="modal-body">
                    <form id="name-form">
                        <div class="mb-3">
                            <label for="name-input" class="form-label">Username:</label>
                            <input type="text" class="form-control" id="name-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Join Chat</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Socket.IO and Bootstrap JS -->
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="chat.js"></script>
</body>
</html>
