<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8th Grade Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>Chat Room</h2>
    
    <div class="header-controls">
        <button id="clearChatBtn" style="display: none;" onclick="clearChat()">Clear Chat</button>

        <div class="user-info" id="nameSection">
          <div id="nameInputArea">
            <input type="text" id="nameInputField" placeholder="Your Name">
            <button onclick="setUsername()">Set</button>
          </div>
          <span id="currentUsername" style="display: none;"></span>
        </div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
