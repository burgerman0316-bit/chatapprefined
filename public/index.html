<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Socket.IO Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <div class="header-area">
      <span id="userCountDisplay">0 Users Online</span>
      <div class="right-header">
        <input id="usernameInput" type="text" placeholder="Enter your name" />
        <button id="joinBtn">Join Chat</button>
        <button id="clearChatBtn" style="display:none;">Clear Chat</button>
      </div>
    </div>

    <div class="messages-area">
      <div id="messages"></div>
    </div>

    <form id="messageForm">
      <div class="input-container">
        <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message..."></div>
      </div>
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- DM Modal -->
  <div class="modal" id="dmModal" style="display:none;">
    <div class="modal-content">
      <button id="closeDmModal" class="modal-close">✖</button>
      <h3>Select a user to DM</h3>
      <div id="dmUserList" class="dm-user-list"></div>
    </div>
  </div>

  <!-- Clear Chat Confirmation Modal -->
  <div class="modal" id="clearChatModal" style="display:none;">
    <div class="modal-content">
      <h3>Clear Chat Confirmation</h3>
      <p>Are you sure you want to clear the chat?</p>
      <button id="confirmClearBtn">Yes, clear</button>
      <button id="cancelClearBtn">Cancel</button>
    </div>
  </div>

  <!-- Reserved Name Modal -->
  <div class="modal" id="reservedNameModal" style="display:none;">
    <div class="modal-content">
      <h3>Name Reserved</h3>
      <p>This name is reserved for staff. Please choose another.</p>
      <button id="closeReservedName">OK</button>
    </div>
  </div>

  <!-- Name In Use Modal -->
  <div class="modal" id="nameInUseModal" style="display:none;">
    <div class="modal-content">
      <h3>Name Taken</h3>
      <p>This name is already in use. Please choose another.</p>
      <button id="closeNameInUse">OK</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
