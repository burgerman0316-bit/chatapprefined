<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Simple Unified Chat</title>
    
    <link rel="stylesheet" href="/style.css"> 
</head>
<body>

    <h2>Unified Chat</h2>
    <ul id="messages"></ul>
    
    <form id="chatForm" class="chat-form">
        <input id="chatInput" autocomplete="on" placeholder="Type your message..." />
        <button>Send</button>
    </form>


    <script src="/socket.io/socket.io.js"></script>
    
    <script src="/client.js"></script> 
</body>
</html>
