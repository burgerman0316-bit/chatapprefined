<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Username Modal -->
    <div class="custom-modal" id="usernameModal">
        <div class="modal-content">
            <h2>Enter Your Username</h2>
            <input type="text" id="usernameInput" placeholder="Your name">
            <button id="joinBtn">Join Chat</button>
            <button class="close-modal" id="usernameClose">&times;</button>
            <p id="usernameError" class="error-text"></p>
        </div>
    </div>

    <!-- DM Modal -->
    <div class="custom-modal" id="dmModal">
        <div class="modal-content">
            <h3>Send Private Message</h3>
            <ul id="dmUserList"></ul>
            <button class="close-modal" id="dmClose">&times;</button>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="custom-modal" id="adminModal">
        <div class="modal-content">
            <h3>Admin Controls</h3>
            <button id="clearHistoryBtn">Clear Chat History</button>
            <button id="banUserBtn">Ban User</button>
            <button id="hardwareBanBtn">Hardware Ban</button>
            <button class="close-modal" id="adminClose">&times;</button>
        </div>
    </div>

    <!-- Chat Area -->
    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input-container">
            <div id="messageInput" contenteditable="true" data-placeholder="Type a message..."></div>
            <button id="sendBtn">Send</button>
        </div>
        <button id="adminPanelBtn" style="display:none;">Admin Panel</button>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
</body>
</html>
