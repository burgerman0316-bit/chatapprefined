<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="container">
        <div id="user-info">
            <h2>Chat Info</h2>
            <p>Welcome, <span id="display-name">Guest</span>!</p>
            <p>Users Online: <span id="user-count">0</span></p>
            <div id="user-list-container">
                <h4>Online Users:</h4>
                <ul id="user-list"></ul>
            </div>
            <p class="commands">**Commands:**</p>
            <p class="commands">`/msg [user] [message]`</p>
            <p class="commands">`/clear` (Mod only)</p>
        </div>
        
        <div id="chat-area">
            <ul id="messages"></ul>
            <form id="form" action="">
                <input id="input" autocomplete="off" placeholder="Type a message or command..." />
                <button>Send</button>
            </form>
        </div>
    </div>

    <div class="modal fade" id="nameModal" tabindex="-1" aria-labelledby="nameModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="nameModalLabel">Enter Your Name</h5>
                </div>
                <div class="modal-body">
                    <form id="name-form">
                        <div class="mb-3">
                            <label for="name-input" class="form-label">Username:</label>
                            <input type="text" class="form-control" id="name-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Join Chat</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="chat.js"></script>
</body>
</html>
