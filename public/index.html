<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Chat Container -->
    <div class="chat-container">

        <!-- Header Area -->
        <div class="header-area">
            <span id="userCountDisplay">0 Users Online</span>
            <div class="right-header">
                <input id="usernameInput" type="text" placeholder="Enter your name">
                <button id="joinBtn">Join Chat</button>
                <button id="clearChatBtn" style="display: none;">Clear Chat</button>
                <button id="adminPanelBtn" style="display: none;">Admin Panel</button>
            </div>
        </div>

        <!-- Messages Area -->
        <div class="messages-area">
            <div id="messages"></div>
        </div>

        <!-- Message Input Form -->
        <form id="messageForm">
            <div class="input-container">
                <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message..."></div>
            </div>
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- DM Modal -->
    <div class="modal" id="dmModal" style="display: none;">
        <div class="modal-content">
            <button class="close-modal" id="closeDmModal">X</button>
            <h3>Select a user to message:</h3>
            <div id="dmUserList" class="modal-user-list"></div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal" id="adminModal" style="display: none;">
        <div class="modal-content">
            <button class="close-modal" id="closeAdminModal">X</button>
            <h3>Admin Controls</h3>
            <button id="adminClearChatBtn">Clear Chat History</button>
            <button id="adminBanUserBtn">Ban User</button>
            <button id="adminHardwareBanBtn">Hardware Ban</button>
            <div id="adminUserList" class="modal-user-list"></div>
        </div>
    </div>

    <!-- Hardware Ban Modal -->
    <div class="modal" id="hardwareBanModal" style="display: none;">
        <div class="modal-content">
            <button class="close-modal" id="closeHardwareBanModal">X</button>
            <h3>Select a user to hardware ban:</h3>
            <div id="hardwareUserList" class="modal-user-list"></div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="chat.js"></script>
</body>
</html>
