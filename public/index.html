<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Chat</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div id="container" style="display: none;">
  <div id="user-info">
    <h2>Chat Info</h2>
    <hr class="info-divider">
    <p>Welcome, <span id="display-name">Guest</span>!
      <button id="renameBtn" class="btn btn-sm btn-outline-light ms-2">Rename</button>
    </p>
    <div class="chat-tabs">
      <div id="publicChatTab" class="chat-tab active">Public</div>
      <div id="adminChatTab" class="chat-tab" style="display: none;">Admin</div>
    </div>
    <p>Users Online: <span id="user-count">0</span></p>
    <hr class="info-divider">
    <div id="user-list-container">
      <h4>Online Users:</h4>
      <ul id="user-list"></ul>
    </div>
    <hr class="info-divider">
    <p class="commands"><b>Commands:</b></p>
    <p class="commands">/msg [user] [message]</p>
    <p class="commands">/clear (Mod only)</p>
    <button id="adminPanelBtn" class="btn btn-secondary mt-3" style="display: none;" data-bs-toggle="modal" data-bs-target="#adminPanelModal">Admin Panel</button>
    <button id="adminLogoutBtn" class="btn btn-sm btn-outline-danger mt-3" style="display: none;">Go Anonymous</button>
  </div>
  <div id="chat-area">
    <h3 id="chatTitle">Public Chat</h3>
    <ul id="messages"></ul>
    <form id="messageForm" action="">
      <div class="input-container">
        <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message or command..."></div>
        <button type="submit">Send</button>
      </div>
      <div id="charCountContainer" class="char-count-display">
        <span id="char-count">0/500</span>
      </div>
    </form>
  </div>
</div>
<!-- Name Modal -->
<div class="modal fade" id="nameModal" tabindex="-1" aria-labelledby="nameModalLabel" aria-hidden="true" data-bs-backdrop="static" data-bs-keyboard="false">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header border-0">
        <h5 class="modal-title" id="nameModalLabel">Join The Chat</h5>
      </div>
      <div class="modal-body">
        <form id="name-form">
          <div class="mb-3">
            <label for="name-input" class="form-label">Username (or Admin Key):</label>
            <input type="text" class="form-control" id="name-input" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Join Chat</button>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- Rename Modal -->
<div class="modal fade" id="renameModal" tabindex="-1" aria-labelledby="renameModalLabel" aria-hidden="true">
  <div class="modal-dialog modal-sm modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="renameModalLabel">Change Display Name</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <form id="rename-form">
          <div class="mb-3">
            <label for="new-name-input" class="form-label">New Username:</label>
            <input type="text" class="form-control" id="new-name-input" required>
          </div>
          <button type="submit" class="btn btn-primary w-100">Update Name</button>
        </form>
      </div>
    </div>
  </div>
</div>
<!-- (Other modals: admin panel, ban, kick, etc. [unchanged, see prior script]) -->

<script src="/socket.io/socket.io.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="chat.js"></script>
</body>
</html>
