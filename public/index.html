<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8th Grade Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>8th Grade Chat Room</h2>
  </div>

  <div class="login-area" id="loginArea">
    <h3>Join the Chat</h3>
    <input type="text" id="usernameInput" placeholder="Enter Your Name">
    <input type="password" id="adminPasswordInput" placeholder="Optional Admin Password">
    <button onclick="loginUser()">Join Chat</button>
  </div>
  <div class="messages" id="messages"></div>

  <div class="input-area" id="inputArea">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="chat.js"></script>
<script>
  // Hide chat elements initially
  document.addEventListener('DOMContentLoaded', () => {
    document.getElementById('messages').style.display = 'none';
    document.getElementById('inputArea').style.display = 'none';
    document.getElementById('usernameInput').focus();
  });
</script>
</body>
</html>
