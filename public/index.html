<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- LEFT PANEL -->
    <aside id="left-panel">
      <div class="panel-section">
        <h3>Online Users</h3>
        <ul id="user-list" class="scrollable"></ul>
      </div>

      <div class="panel-section">
        <h3>Kick / Ban Menu</h3>
        <div id="kick-panel" class="scrollable"></div>
      </div>

      <div class="panel-section" id="admin-controls" style="display:none;">
        <h3>Admin Panel</h3>
        <button id="open-admin-chat">Open Admin Chat</button>
        <div class="admin-control-row">
          <label>Spam limit (msgs / 10s)</label>
          <input id="spam-limit" type="number" min="1" max="50" value="6" />
        </div>
      </div>
    </aside>

    <!-- MAIN CHAT -->
    <main id="main">
      <div id="chat-area">
        <div id="messages" class="scrollable"></div>
      </div>

      <div id="composer">
        <div id="composer-top">
          <input id="display-name" placeholder="Display name (unique)" maxlength="64" />
          <button id="change-name">Change</button>
          <label><input id="anon-toggle" type="checkbox" /> Anonymous</label>
          <span id="me-label"></span>
        </div>

        <div id="composer-middle">
          <textarea id="message-input" maxlength="256" placeholder="Type a message..."></textarea>
          <div id="char-counter">0/256</div>
        </div>

        <div id="composer-bottom">
          <button id="send">Send</button>
          <button id="clear-chat">Clear Chat (Admin)</button>
          <div id="system-warnings"></div>
        </div>
      </div>
    </main>

    <!-- RIGHT PANEL -->
    <aside id="right-panel">
      <div class="panel-section">
        <h3>Admin Chat</h3>
        <div id="admin-chat" class="scrollable" style="height:200px;"></div>
        <textarea id="admin-message" placeholder="Admin message..."></textarea>
        <button id="send-admin" style="display:none;">Send</button>
      </div>
    </aside>
  </div>

  <!-- BAN MODAL -->
  <div id="ban-modal" class="modal hidden">
    <div class="modal-inner">
      <h2>You are banned</h2>
      <p id="ban-reason"></p>
      <p id="ban-countdown"></p>
    </div>
  </div>

  <!-- SOCKET.IO + SCRIPT -->
  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
