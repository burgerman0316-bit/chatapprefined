<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Socket.IO Chat</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <!-- Header / Controls -->
    <div class="header-area">
      <span id="userCountDisplay">0 Users Online</span>
      <div class="right-header">
        <input id="usernameInput" type="text" placeholder="Enter your name">
        <button id="joinBtn">Join Chat</button>
        <button id="clearChatBtn" style="display:none;">Clear Chat</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-area">
      <div id="messages"></div>
    </div>

    <!-- Message Input -->
    <form id="messageForm">
      <div class="input-container">
        <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message..."></div>
      </div>
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Staff/Name Collision Modal -->
  <div class="modal" id="nameConflictModal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" id="nameConflictClose">&times;</button>
      <p id="nameConflictText"></p>
      <button id="nameConflictOk">OK</button>
    </div>
  </div>

  <!-- DM Modal -->
  <div class="modal" id="dmModal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn" id="dmClose">&times;</button>
      <h3>Select a user to DM</h3>
      <div id="dmUserList"></div>
    </div>
  </div>

<script src="/socket.io/socket.io.js"></script>
<script src="chat.js"></script>
</body>
</html>
