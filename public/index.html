<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8th Grade Chat</title>
  <link rel="stylesheet" href="style.css">
  
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div id="customModal" class="custom-modal" style="display: none;">
    <div class="modal-content">
        <p id="modalMessage"></p>
        <div class="modal-buttons" id="modalButtons">
            </div>
    </div>
</div>

<div class="chat-container">
  <div class="chat-header">
    <h2>Chat Room</h2>
    
    <div class="header-controls">
        <button id="clearChatBtn" style="display: none;" onclick="clearChat()">Clear Chat</button>

        <div class="user-info" id="nameSection">
            <div id="googleSignInContainer">
                <div id="g_id_onload"
                    data-client_id="941883680757-7q09u3jt3u1rcj75ruccog15s1h88jsh.apps.googleusercontent.com" 
                    data-context="signin"
                    data-ux_mode="popup"
                    data-callback="handleCredentialResponse"
                    data-auto_prompt="false">
                </div>
    
                <div class="g_id_signin"
                    data-type="standard"
                    data-shape="rectangular"
                    data-theme="outline"
                    data-text="signin_with"
                    data-size="small"
                    data-width="150"> 
                </div>
            </div>
          
          <span id="currentUsername" style="display: none;"></span>
        </div>
    </div>
  </div>

  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
