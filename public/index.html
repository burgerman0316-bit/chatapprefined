<!DOCTYPE html>
<html>
<head>
    <title>Fixed Socket.IO Chat</title>
    <style>
        /* (Styles omitted for brevity, but keep them) */
        body { margin: 0; padding-bottom: 3rem; font-family: sans-serif; }
        #messages { list-style-type: none; margin: 0; padding: 0; border: 1px solid #ccc; margin-bottom: 10px; }
        #messages li { padding: 0.5rem 1rem; }
        #messages li:nth-child(odd) { background: #f4f4f4; }
        #staffMessages { list-style-type: none; margin-top: 20px; padding: 10px; border: 1px solid darkred; background-color: #fdd; }
        #staffMessages li { padding: 0.25rem 0.5rem; color: darkred; }
        
        .chat-form { 
            background: rgba(0, 0, 0, 0.05);
            padding: 0.5rem; 
            margin-top: 10px;
            display: flex;
            align-items: center;
        }
        .chat-form input { flex-grow: 1; padding: 0.5rem; margin-right: 0.5rem; border: 1px solid #ccc; }
        .chat-form button { padding: 0.5rem 1rem; cursor: pointer; }
    </style>
</head>
<body>

    <h2>General Chat</h2>
    <ul id="messages"></ul>
    
    <form id="generalForm" class="chat-form">
        <input id="generalInput" autocomplete="off" placeholder="Type a General Message" />
        <button>Send General</button>
    </form>

    <hr>
    <h2>Staff Chat (Admin Console)</h2>
    <ul id="staffMessages"></ul>

    <form id="staffForm" class="chat-form">
        <input id="staffChatInput" autocomplete="off" placeholder="Type a Staff Message" />
        <button style="background-color: darkred; color: white;">Send Staff</button>
    </form>


    <script src="/socket.io/socket.io.js"></script>
    <script>
        // CLIENT-SIDE JAVASCRIPT IS BELOW
    </script>
</body>
</html>
