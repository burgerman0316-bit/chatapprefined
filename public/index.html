<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>8th Grade Chat</title>
  <link rel="stylesheet" href="style.css">
  <script src="/socket.io/socket.io.js"></script>
</head>
<body>

<div class="chat-container">
  <div class="chat-header">
    <h2>Chat Room <span id="currentUsername" style="font-size: 0.7em; margin-left: 10px; color: #555;">(Not Signed In)</span></h2>
  </div>

  <div class="name-input-area" id="nameInputArea">
    <input type="text" id="nameInputField" placeholder="Enter your name">
    <button onclick="setUsername()">Set Name</button>
  </div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input type="text" id="messageInput" placeholder="Type a message...">
    <button onclick="sendMessage()">Send</button>
  </div>
</div>

<script src="chat.js"></script>
</body>
</html>
