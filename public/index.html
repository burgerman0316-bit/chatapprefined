<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Chat</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="modal fade" id="nameModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="nameModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="nameModalLabel">Enter Your Name</h5>
                </div>
                <div class="modal-body">
                    <form id="name-form">
                        <div class="mb-3">
                            <input type="text" class="form-control" id="name-input" placeholder="Your Name or Staff Code" required>
                        </div>
                        <p id="nameError" class="text-danger"></p>
                        <button type="submit" class="btn btn-primary w-100">Join Chat</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div id="container" class="container-fluid" style="display: none;">
        <div id="sidebar" class="d-flex flex-column p-3 bg-light">
            <h4 class="mb-3">
                <span id="display-name">Guest</span>
                <span class="badge bg-secondary ms-2" id="user-count">0</span>
            </h4>
            <div id="online-users" class="flex-grow-1 overflow-auto">
                <h5>Online Users</h5>
                <ul id="user-list" class="list-unstyled">
                    </ul>
            </div>
            
            <button id="adminPanelBtn" class="btn btn-warning mt-3" data-bs-toggle="modal" data-bs-target="#adminPanelModal" style="display: none;">
                Admin Panel
            </button>
        </div>

        <div id="main-chat" class="d-flex flex-column flex-grow-1">
            <div id="messages-container" class="flex-grow-1 overflow-auto">
                <ul id="messages" class="list-unstyled p-3">
                    </ul>
            </div>
            
            <form id="messageForm" class="input-group p-3">
                <div id="messageInput" contenteditable="true" class="form-control" placeholder="Type your message or command (/msg, /ban, /kick)..."></div>
                <button type="submit" class="btn btn-primary">Send</button>
            </form>
        </div>
    </div>

    <div class="modal fade" id="adminPanelModal" tabindex="-1" aria-labelledby="adminPanelModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminPanelModalLabel">Admin Actions</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <button id="clearChatBtn" class="btn btn-danger w-100 mb-3">Clear Chat History</button>
                    <hr>
                    <h6>Kick/Ban Users (Click name)</h6>
                    <ul id="admin-user-list" class="list-unstyled list-group">
                        </ul>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="clearConfirmModal" tabindex="-1" aria-labelledby="clearConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="clearConfirmModalLabel">Confirm Clear</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    Are you sure you want to clear all chat history for everyone? This cannot be undone.
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                    <button type="button" class="btn btn-danger" id="clearConfirmBtn">Clear History</button>
                </div>
            </div>
        </div>
    </div>
    
    <div class="modal fade" id="kickConfirmModal" tabindex="-1" aria-labelledby="kickConfirmModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="kickConfirmModalLabel">Moderation Actions</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body" id="kickConfirmBody">
                    </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="/socket.io/socket.io.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/@fingerprintjs/fingerprintjs@4/dist/fp.min.js"></script> 

    <script src="chat.js"></script>
</body>
</html>
