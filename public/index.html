<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">
    <div class="header-area">
      <div class="left-header">
        <strong>Chat Room</strong>
      </div>

      <div class="right-header">
        <span id="userCountDisplay">0 Users Online</span>
        <input id="usernameInput" type="text" placeholder="Enter name" />
        <button id="joinBtn" type="button">Join</button>
        <button id="clearChatBtn" type="button" style="display:none">Clear Chat</button>
        <button id="adminPanelBtn" type="button" style="display:none">Admin Control Panel</button>
      </div>
    </div>

    <div class="messages-area">
      <div id="messages"></div>
    </div>

    <form id="messageForm" autocomplete="off">
      <div class="input-container">
        <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message..."></div>
      </div>
      <button id="sendBtn" type="submit">Send</button>
    </form>
  </div>

  <!-- DM Modal -->
  <div id="dmModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" id="dmCloseBtn">&times;</button>
      <h3>Select a user to DM</h3>
      <div id="dmUserList" class="dm-user-list"></div>
    </div>
  </div>

  <!-- Name error modal -->
  <div id="nameErrorModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="modal-close" id="nameErrorClose">&times;</button>
      <p id="nameErrorText"></p>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div id="adminModal" class="modal" style="display:none;">
    <div class="modal-content" style="max-width:700px;">
      <button class="modal-close" id="adminCloseBtn">&times;</button>
      <h2>Admin Control Panel</h2>

      <div class="admin-columns">
        <div class="admin-column">
          <h4>Online Users</h4>
          <div id="adminUserList" class="admin-user-list"></div>
        </div>

        <div class="admin-column">
          <h4>Actions</h4>

          <div class="admin-action">
            <label for="banUsernameInput">Ban username</label>
            <input id="banUsernameInput" placeholder="username to ban" />
            <button id="banUsernameBtn">Ban user</button>
          </div>

          <div class="admin-action">
            <label for="unbanUsernameInput">Unban username</label>
            <input id="unbanUsernameInput" placeholder="username to unban" />
            <button id="unbanUsernameBtn">Unban</button>
          </div>

          <div class="admin-action">
            <label for="banIpInput">Ban IP address</label>
            <input id="banIpInput" placeholder="IP to ban (e.g. 1.2.3.4)" />
            <button id="banIpBtn">Ban IP</button>
          </div>

          <div class="admin-action">
            <label for="unbanIpInput">Unban IP</label>
            <input id="unbanIpInput" placeholder="IP to unban" />
            <button id="unbanIpBtn">Unban IP</button>
          </div>

          <div class="admin-action">
            <label for="forceDisconnectInput">Force disconnect (username)</label>
            <input id="forceDisconnectInput" placeholder="username to disconnect" />
            <button id="forceDisconnectBtn">Disconnect</button>
          </div>

          <div class="admin-action">
            <button id="adminClearHistoryBtn" class="danger">Clear Chat History</button>
          </div>

          <div class="admin-action">
            <h4>Banned lists</h4>
            <div>
              <strong>User bans</strong>
              <div id="bannedUserList" class="admin-ban-list"></div>
            </div>
            <div style="margin-top:8px;">
              <strong>IP bans</strong>
              <div id="bannedIpList" class="admin-ban-list"></div>
            </div>
          </div>
        </div>
      </div>

    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
