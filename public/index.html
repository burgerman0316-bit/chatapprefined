<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket.IO Chat</title>
    <link rel="stylesheet" href="style.css"> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div id="container">
        <!-- Chat Info Sidebar -->
        <div id="user-info">
            <h2>Chat Info</h2>
            <p>Welcome, <span id="display-name">Guest</span>!</p>
            <p>Users Online: <span id="user-count">0</span></p>
            <div id="user-list-container">
                <h4>Online Users:</h4>
                <ul id="user-list"></ul>
            </div>
            <p class="commands">**Commands:**</p>
            <p class="commands">`/msg [user] [message]`</p>
            <p class="commands">`/clear` (Mod only)</p>
        </div>

        <!-- Chat Area -->
        <div id="chat-area">
            <ul id="messages"></ul>
            <form id="messageForm" action="">
                <div class="input-container">
                    <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message or command..."></div>
                    <button type="submit">Send</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Login Modal -->
    <div class="modal fade" id="nameModal" tabindex="-1" aria-labelledby="nameModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="nameModalLabel">Enter Your Name</h5>
                </div>
                <div class="modal-body">
                    <form id="name-form">
                        <div class="mb-3">
                            <label for="name-input" class="form-label">Username:</label>
                            <input type="text" class="form-control" id="name-input" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Join Chat</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- DM Modal -->
    <div class="modal fade" id="dmModal" tabindex="-1" aria-labelledby="dmModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dmModalLabel">Send Private Message</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <ul id="dm-user-list" class="user-select-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- Admin Panel Modal -->
    <div class="modal fade" id="adminPanelModal" tabindex="-1" aria-labelledby="adminPanelLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="adminPanelLabel">Admin Control Panel</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <button id="clearChatBtn" class="btn btn-danger mb-2">Clear Chat History</button>
                    <button id="hardwareBanBtn" class="btn btn-warning mb-2">Hardware Ban User</button>
                    <ul id="admin-user-list" class="user-select-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="chat.js"></script>
</body>
</html>
