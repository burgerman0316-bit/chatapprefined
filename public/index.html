<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Socket.IO Chat</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="chat-container">

    <!-- Header / Controls -->
    <div class="header-area">
      <input type="text" id="usernameInput" placeholder="Enter your name">
      <div class="right-header">
        <button id="joinBtn">Join Chat</button>
        <button id="openAdminPanelBtn" style="display:none;">Admin Panel</button>
      </div>
    </div>

    <!-- Messages -->
    <div class="messages-area">
      <div id="messages"></div>
    </div>

    <!-- Message input -->
    <form id="messageForm">
      <div class="input-container">
        <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message..."></div>
        <button type="submit">Send</button>
      </div>
    </form>

  </div>

  <!-- Private Message Modal -->
  <div id="dmModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn">&times;</button>
      <h3>Select a user to message</h3>
      <div id="dmUserList" class="scroll-list"></div>
    </div>
  </div>

  <!-- Admin Panel Modal -->
  <div id="adminPanelModal" class="modal" style="display:none;">
    <div class="modal-content">
      <button class="close-btn">&times;</button>
      <h3>Admin Controls</h3>
      <button id="panelClearChatBtn">Clear Chat</button>
      <button id="panelBanUserBtn">Ban User</button>
      <button id="panelHWBanBtn">Hardware Ban User</button>
      <!-- add more admin controls here -->
    </div>
  </div>

  <!-- Staff / Name Reserved Modal -->
  <div id="nameReservedModal" class="modal" style="display:none;">
    <div class="modal-content">
      <h3>Name Reserved</h3>
      <p>This name is reserved for staff or already in use.</p>
      <button class="close-btn">Close</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="chat.js"></script>
</body>
</html>
