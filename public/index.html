<!DOCTYPE html>
<html>
<head>
    <title>Broken Fix Test</title>
</head>
<body>
    <h1>Check your Console for Connection Status!</h1>
    
    <script src="/socket.io/socket.io.js"></script> 
    
    <script>
        // 2. INSTANTIATE THE SOCKETS
        var generalSocket = io();
        var staffSocket = io('/staff'); 

        // 3. LISTEN FOR CONNECTION ERRORS AND SUCCESS
        generalSocket.on('connect', () => {
            console.log('Client: General Socket Connected!');
            // You should see this in your browser console if it works
        });

        generalSocket.on('connect_error', (err) => {
            console.error('Client Error: General Socket Failed to Connect!', err.message);
            // This will tell you exactly what is wrong
        });
        
        staffSocket.on('connect', () => {
            console.log('Client: Staff Socket Connected!');
        });
        
    </script>
</body>
</html>
