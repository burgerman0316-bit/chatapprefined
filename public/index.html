<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="chat-container">
    <!-- Header Area -->
    <div class="header-area">
      <span id="userCountDisplay">0 Users Online</span>
      <div class="right-header">
        <input id="usernameInput" type="text" placeholder="Enter your name" />
        <button id="joinBtn">Join Chat</button>
        <button id="clearChatBtn" style="display: none;">Clear Chat</button>
      </div>
    </div>

    <!-- Messages Area -->
    <div class="messages-area">
      <div id="messages"></div>
    </div>

    <!-- DM User Menu (hidden by default, pops up above input) -->
    <div class="dm-user-menu" style="display: none;"></div>

    <!-- Message Input Form -->
    <form id="messageForm">
      <div class="input-container">
        <div id="messageInput" class="custom-input" contenteditable="true" data-placeholder="Type a message..."></div>
      </div>
      <button type="submit">Send</button>
    </form>
  </div>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>
  <!-- Your chat JS -->
  <script src="chat.js"></script>
</body>
</html>
